<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background-container">
        <div class="wrapper">
            <h1>Login Page</h1>
            <div class="input-fields">
                <input type="text" name="username" id="uname" placeholder="Enter Username"><br><br>
                <input type="password" name="password" id="upass" placeholder="Enter Password"><br><br>

                <div class="options">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me" class="remember">Remember Me</label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit">Submit</button>
            </div>
        </div>
    </div>
</body>
</html>
